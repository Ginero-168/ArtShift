[package]
name = "artshift-vtracer-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "ArtShift browser binding for the VisionCortex VTracer WebAssembly core."
repository = "https://github.com/visioncortex/vtracer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtracer = "=1.0.0-alpha.4"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
